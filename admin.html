      </div>
      <div class="panel"><h2>Добавить расход</h2>
        <div class="exp-form">
          <label class="field"><span>Дата</span><input class="input" type="date" id="exDate" value="${today()}"></label>
          <label class="field"><span>На что</span><input class="input" id="exCat" list="expCats" placeholder="Реклама"><datalist id="expCats">${EXP_CATS.map(c => `<option value="${c}">`).join('')}</datalist></label>
          <label class="field"><span>Сумма, ₸</span><input class="input" type="number" min="1" id="exAmount" inputmode="numeric"></label>
          <label class="field wide"><span>Комментарий</span><input class="input" id="exComment" placeholder="Например: таргет Instagram"></label>
          <button class="btn btn-accent wide" id="exAdd" style="min-height:44px">Добавить</button>
        </div>
        <div class="chips" style="margin-top:10px">${EXP_CATS.map(c => `<button class="chip" data-excat="${c}">${c}</button>`).join('')}</div>
      </div>
      <div class="cols">
        <div class="panel"><h2>Расходы <small>${monthName(m)}</small></h2>
          ${x.expenses.length ? `<div class="tbl-wrap"><table><tbody>${x.expenses.map(e => `<tr><td>${ruDate(e.date)}</td><td><b>${esc(e.category)}</b>${e.comment ? `<br><small class="muted">${esc(e.comment)}</small>` : ''}</td><td class="r">${money(e.amount)}</td><td class="r"><button class="icon-btn" data-exdel="${esc(e.id)}" title="Удалить">✕</button></td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">Расходов за месяц нет</div>'}
        </div>
        <div class="panel"><h2>По категориям</h2>
          ${Object.keys(x.byCat).length ? `<div class="tbl-wrap"><table><tbody>${Object.entries(x.byCat).sort((a, b) => b[1] - a[1]).map(c => `<tr><td class="bar-cell"><i style="width:${Math.round(c[1] / x.spent * 100)}%"></i><span style="position:relative">${esc(c[0])}</span></td><td class="r">${money(c[1])}</td><td class="r muted">${Math.round(c[1] / x.spent * 100)}%</td></tr>`).join('')}</tbody></table></div>
          ${x.byCat['Реклама'] && x.newClients ? `<p class="hint">Реклама: ${money(x.byCat['Реклама'])} · новых клиентов ${x.newClients} · ≈ ${money(x.byCat['Реклама'] / x.newClients)} за клиента</p>` : ''}` : '<div class="empty">—</div>'}
        </div>
      </div>
      <div class="panel"><h2>Чеки <small>${monthName(m)} · хранятся в листе «Чеки»</small></h2>
        ${x.receipts.length ? `<div class="tbl-wrap"><table><thead><tr><th>Чек</th><th>Дата</th><th>Заказ</th><th>Покупатель</th><th>Оплата</th><th class="r">Сумма</th></tr></thead><tbody>${x.receipts.map(r => `<tr class="click" data-rcpt="${esc(r.number)}"><td><b>${esc(r.number)}</b></td><td>${ruDate(r.date)}</td><td>№ ${esc(r.order)}</td><td>${esc(r.client || '—')}</td><td>${esc(r.payment)}</td><td class="r">${money(r.total)}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">Чеков за месяц нет. Чек создаётся кнопкой «🧾 Чек» в заказе</div>'}
      </div>`;
    $('#monthPick').addEventListener('change', e => { if (e.target.value) { S.month = e.target.value; renderMoney(); } });
    $$('[data-excat]').forEach(b => b.addEventListener('click', () => { $('#exCat').value = b.dataset.excat; $('#exAmount').focus(); }));
    $('#exAdd').addEventListener('click', () => {
      const e = { id: 'tmp' + Date.now(), date: $('#exDate').value || today(), category: $('#exCat').value.trim() || 'Прочее', amount: Number($('#exAmount').value), comment: $('#exComment').value.trim() };
      if (!(e.amount > 0)) return toast('Укажите сумму', true);
      S.data.expenses = S.data.expenses || [];
      S.data.expenses.push(e);
      mutate('save_expense', { expense: Object.assign({}, e, { id: '' }) }, 'Расход добавлен');
      renderMoney();
    });
    $$('[data-exdel]').forEach(b => b.addEventListener('click', () => {
      const id = b.dataset.exdel;
      if (id.startsWith('tmp')) return toast('Подождите секунду — расход ещё сохраняется', true);
      if (!confirm('Удалить расход?')) return;
      S.data.expenses = S.data.expenses.filter(e => e.id !== id);
      mutate('delete_expense', { id: id }, 'Удалено');
      renderMoney();
    }));
    $$('tr[data-rcpt]').forEach(tr => tr.addEventListener('click', () => {
      const r = S.data.receipts.find(x => x.number === tr.dataset.rcpt);
      const o = S.data.orders.find(x => x.number === r.order);
      if (o) return receiptDialog(o);
      openDlg(`<h2>Чек ${esc(r.number)}<button class="x" data-x>×</button></h2>${receiptHtml(r, null)}<div class="row-actions"><button class="btn btn-accent" id="rcPrint">Печать / PDF</button></div>`);
      $('#rcPrint').addEventListener('click', () => printHtml('Чек ' + r.number, receiptHtml(r, null)));
    }));
    $('#repPrint').addEventListener('click', () => printReport(m, x));
    $('#repCsv').addEventListener('click', () => exportCsv(m, x));
  }

  function printReport(m, x) {
    const row = (a, b) => `<tr><td>${a}</td><td class="r">${b}</td></tr>`;
    printHtml('Отчёт SMELL PARFUME — ' + monthName(m), `<h1>SMELL PARFUME — отчёт за ${monthName(m)}</h1><div style="color:#666">сформирован ${ruDate(today())}</div>
      <h2>Итоги</h2><div class="k">
        <div>Выручка<b>${money(x.revenue)}</b></div><div>Прибыль с продаж<b>${money(x.profit)}</b></div><div>Расходы<b>${money(x.spent)}</b></div>
        <div>Чистая прибыль<b>${money(x.profit - x.spent)}</b></div><div>Продаж<b>${x.nOrders}</b></div><div>Продано<b>${fmtNum(x.ml)} мл</b></div>
        <div>Средний чек<b>${money(x.nOrders ? x.revenue / x.nOrders : 0)}</b></div><div>Маржа<b>${x.revenue ? Math.round(x.profit / x.revenue * 100) : 0}%</b></div><div>Новых клиентов<b>${x.newClients}</b></div></div>
      <h2>Расходы по категориям</h2><table><tbody>${Object.entries(x.byCat).sort((a, b) => b[1] - a[1]).map(c => row(esc(c[0]), money(c[1]))).join('') || row('—', '')}</tbody></table>
      <h2>Топ ароматов</h2><table><thead><tr><th>Аромат</th><th class="r">мл</th><th class="r">Выручка</th><th class="r">Прибыль</th></tr></thead><tbody>${x.top.slice(0, 15).map(t => `<tr><td>${esc(t.name)}</td><td class="r">${fmtNum(t.ml)}</td><td class="r">${money(t.r)}</td><td class="r">${money(t.p)}</td></tr>`).join('')}</tbody></table>
      <h2>Продажи</h2><table><thead><tr><th>Дата</th><th>№</th><th>Покупатель</th><th class="r">Сумма</th></tr></thead><tbody>${x.orders.map(o => `<tr><td>${ruDate(o.date.slice(0, 10))}</td><td>${esc(o.number)}</td><td>${esc([o.name, o.surname].filter(Boolean).join(' ') || '—')}</td><td class="r">${money(o.total)}</td></tr>`).join('')}</tbody></table>
      <h2>Расходы</h2><table><tbody>${x.expenses.map(e => `<tr><td>${ruDate(e.date)}</td><td>${esc(e.category)}${e.comment ? ' — ' + esc(e.comment) : ''}</td><td class="r">${money(e.amount)}</td></tr>`).join('') || row('—', '')}</tbody></table>`);
  }

  // CSV с «;» и BOM — Excel открывает двойным щелчком с русскими буквами.
  function exportCsv(m, x) {
    const q = v => { const t = String(v == null ? '' : v); return /[;"\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; };
    const lines = [['Отчёт SMELL PARFUME', monthName(m)], [], ['Выручка', Math.round(x.revenue)], ['Прибыль с продаж', Math.round(x.profit)], ['Расходы', Math.round(x.spent)], ['Чистая прибыль', Math.round(x.profit - x.spent)], ['Продаж', x.nOrders], ['Продано, мл', x.ml], [],
      ['ПРОДАЖИ'], ['Дата', 'Заказ', 'Аромат', 'мл', 'Выручка', 'Прибыль', 'Телефон']];
    S.data.sales.filter(s => s.date.slice(0, 7) === m).sort((a, b) => a.date.localeCompare(b.date)).forEach(s => lines.push([s.date.slice(0, 16), s.order, s.product, s.ml, Math.round(s.revenue), Math.round(s.profit), s.phone]));
    lines.push([], ['РАСХОДЫ'], ['Дата', 'Категория', 'Сумма', 'Комментарий']);
    x.expenses.forEach(e => lines.push([e.date, e.category, e.amount, e.comment]));
    lines.push([], ['ЧЕКИ'], ['Чек', 'Дата', 'Заказ', 'Покупатель', 'Оплата', 'Сумма']);
    x.receipts.forEach(r => lines.push([r.number, r.date, r.order, r.client, r.payment, r.total]));
    const blob = new Blob(['\ufeff' + lines.map(l => l.map(q).join(';')).join('\r\n')], { type: 'text/csv;charset=utf-8' });
    const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: 'smell-parfume-' + m + '.csv' });
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
  const secRow = s => `<div class="le"><input class="input" type="text" value="${esc(s.name)}" placeholder="Название раздела"><label class="check" title="Показывать на сайте"><input type="checkbox" ${s.visible ? 'checked' : ''}>видно</label><button class="icon-btn" data-up title="Выше">↑</button><button class="icon-btn" data-down title="Ниже">↓</button><button class="icon-btn" data-del title="Удалить">✕</button></div>`;
  const setChip = id => { const p = S.data.byId[id]; return `<button class="chip" data-rmid="${esc(id)}" title="Убрать">${esc(p ? p.brand + ' ' + p.name : id)} ✕</button>`; };
  const setRow = s => `<div class="fe">
    <div style="display:flex;gap:8px"><input class="input" data-n="name" value="${esc(s.name)}" placeholder="Название набора"><button class="icon-btn" data-del title="Удалить набор">✕</button></div>
    <div class="chips set-items">${(s.items || []).map(setChip).join('')}</div>
    <div style="display:flex;gap:8px"><input class="input" data-pick list="productList" placeholder="Добавить аромат — начните вводить"><button class="btn btn-small" data-addp>Добавить</button></div>
    <div class="grid3">
      <label class="field"><span>мл каждого</span><input class="input" type="number" min="1" data-n="ml" value="${s.ml}"></label>
      <label class="field"><span>Скидка, %</span><input class="input" type="number" min="0" max="90" data-n="discount" value="${s.discount}"></label>
      <label class="check" style="align-self:end;padding-bottom:10px"><input type="checkbox" data-n="visible" ${s.visible ? 'checked' : ''}> показывать</label>
    </div>
    <input class="input" data-n="description" value="${esc(s.description)}" placeholder="Описание (одно предложение)">
  </div>`;
  const revRow = r => `<div class="fe" data-date="${esc(r.date || '')}" data-order="${esc(r.order || '')}" data-phone="${esc(r.phone || '')}">
    ${r.order || !r.visible && r.rating ? `<small class="hint">${!r.visible ? '<b style="color:var(--accent)">Новый, ждёт публикации</b> · ' : ''}${r.order ? 'заказ № ' + esc(r.order) + ' · ' : ''}${ruDate(r.date)}</small>` : ''}
    <div style="display:flex;gap:8px"><select class="select" data-n="rating" style="width:auto;flex:none" title="Оценка">${[5, 4, 3, 2, 1].map(n => `<option value="${n}" ${(r.rating || 5) === n ? 'selected' : ''}>${'★'.repeat(n)}</option>`).join('')}</select><input class="input" data-n="name" value="${esc(r.name)}" placeholder="Имя автора"><label class="check"><input type="checkbox" data-n="visible" ${r.visible ? 'checked' : ''}>видно</label><button class="icon-btn" data-del title="Удалить">✕</button></div>
    <textarea class="textarea" data-n="text" style="min-height:70px" placeholder="Текст отзыва">${esc(r.text)}</textarea>
    <input class="input" data-n="photo" value="${esc(r.photo)}" placeholder="Ссылка на фото (необязательно)">
  </div>`;
  const faqRow = f => `<div class="fe"><div style="display:flex;gap:8px"><input class="input" value="${esc(f.q)}" placeholder="Вопрос"><button class="icon-btn" data-del title="Удалить">✕</button></div><textarea class="textarea" style="min-height:70px" placeholder="Ответ">${esc(f.a)}</textarea></div>`;

  // ───────── Диалоги, уведомления ─────────
  function openDlg(html) {
    $('#dlgBody').innerHTML = html;
    const d = $('#dlg');
    if (!d.open) d.showModal();
    $('#dlgBody').scrollTop = 0;
  }
  function closeDlg() { $('#dlg').close(); }
  $('#dlg').addEventListener('click', e => { if (e.target === $('#dlg') || e.target.closest('[data-x]')) closeDlg(); });
  // Пересоздаём содержимое при каждом открытии, поэтому старые обработчики уходят вместе с ним.
  $('#dlg').addEventListener('close', () => {
    $('#dlgBody').replaceWith(Object.assign(document.createElement('div'), { className: 'modal', id: 'dlgBody' }));
    if (S.renderAfterDialog) { S.renderAfterDialog = false; render(); }
  });

  let tt;
  function toast(msg, err) {
    const t = $('#toast');
    t.textContent = msg; t.className = 'toast show' + (err ? ' error' : '');
    clearTimeout(tt); tt = setTimeout(() => { t.className = 'toast'; }, 3000);
  }

  start();
})();
</script>
</body>
</html>
