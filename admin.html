<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Админка — SMELL PARFUME</title>
<meta name="theme-color" content="#212121">
<link rel="icon" href="assets/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Italiana&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/base.css?v=3">
<style>
  body { font-size: 14px; }
  .app { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
  .side { border-right: 1px solid var(--line); padding: 20px 14px; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 4px; }
  .side .logo { display: flex; align-items: center; gap: 10px; margin: 0 6px 22px; }
  .side .logo img { width: 36px; height: 36px; border-radius: 50%; }
  .side .logo b { font-family: var(--font-deco); font-weight: 400; letter-spacing: .1em; font-size: 15px; line-height: 1.1; }
  .tab { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 12px; border: 0; border-radius: 10px; background: none; color: var(--muted); text-align: left; font-weight: 500; }
  .tab:hover { color: var(--text); }
  .tab.active { background: var(--surface-2); color: var(--text); }
  .tab svg { width: 18px; height: 18px; flex: none; }
  .tab .count { margin-left: auto; background: var(--accent); color: var(--accent-ink); border-radius: 999px; font-size: 11px; font-weight: 700; padding: 1px 7px; }
  .side .bottom { margin-top: auto; display: grid; gap: 4px; }
  main { padding: 24px 28px 100px; min-width: 0; }
  .head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  .head h1 { margin: 0 auto 0 0; font-family: var(--font-display); font-weight: 500; font-size: 32px; }
  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; }
    .side { position: fixed; top: auto; bottom: 0; left: 0; right: 0; height: auto; flex-direction: row; padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); background: var(--bg-2); border-right: 0; border-top: 1px solid var(--line); z-index: 40; gap: 0; }
    .side .logo, .side .bottom { display: none; }
    .tab { flex-direction: column; gap: 3px; padding: 6px 2px; font-size: 10px; justify-content: center; position: relative; }
    .tab .count { position: absolute; top: 0; right: 50%; margin-right: -22px; }
    .tab.extra { display: none; }
    .side .tab.more { display: flex; }
    .tab svg { width: 22px; height: 22px; }
    main { padding: 16px 16px 110px; }
    .head h1 { font-size: 26px; }
    .order .actions .btn, .order .actions a.btn { min-height: 42px; padding-left: 14px; padding-right: 14px; }
    .chip { min-height: 36px; }
    .prod-row { grid-template-columns: 44px 1fr auto; row-gap: 6px; }
    .prod-row .th { width: 44px; height: 44px; }
    .prod-row .stk { grid-column: 2 / 3; justify-content: flex-start; }
    .prod-row .switch { grid-column: 3; grid-row: 2; justify-self: end; }
  }
  .tab.more { display: none; }
  .more-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .more-grid .btn { min-height: 56px; justify-content: flex-start; gap: 10px; }
  .more-grid svg { width: 20px; height: 20px; }

  .kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
  .kpi span { font-size: 12px; color: var(--muted); }
  .kpi b { display: block; font-size: 24px; font-weight: 700; margin-top: 4px; letter-spacing: -.01em; }
  .kpi small { color: var(--faint); font-size: 12px; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; margin-bottom: 16px; min-width: 0; }
  .panel h2 { margin: 0 0 14px; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
  .panel h2 small { font-weight: 400; color: var(--muted); }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 1100px) { .cols { grid-template-columns: 1fr; } }
  .chart { width: 100%; height: 220px; display: block; }
  .legend { display: flex; gap: 16px; font-size: 12px; color: var(--muted); margin-top: 8px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }

  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
  td.r, th.r { text-align: right; white-space: nowrap; }
  tr.click { cursor: pointer; }
  tr.click:hover td { background: rgba(255,255,255,.025); }
  .tbl-wrap { overflow-x: auto; }

  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
  .toolbar .input { max-width: 320px; min-height: 40px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }

  .order { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: grid; gap: 10px; margin-bottom: 12px; }
  .order .top { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .order .num { font-weight: 700; font-size: 16px; }
  .order .items { color: var(--muted); font-size: 13px; }
  .order .items div { padding: 2px 0; }
  .order .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .status { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; letter-spacing: .03em; }
  .st-new { background: var(--accent); color: var(--accent-ink); }
  .st-sold { background: rgba(143,191,138,.18); color: var(--ok); }
  .st-cancel { background: rgba(224,122,106,.15); color: var(--danger); }
  .st-noans { background: var(--surface-2); color: var(--muted); }

  .prod-row { display: grid; grid-template-columns: 48px 1fr auto auto auto; gap: 12px; align-items: center; padding: 10px 4px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .prod-row:hover { background: rgba(255,255,255,.02); }
  .prod-row .th { width: 48px; height: 48px; border-radius: 8px; overflow: hidden; background: var(--bg-2); display: grid; place-items: center; font-family: var(--font-deco); color: var(--muted); }
  .prod-row .th img { width: 100%; height: 100%; object-fit: cover; }
  .prod-row .nm small { display: block; color: var(--muted); font-size: 12px; }
  .prod-row .pr { text-align: right; white-space: nowrap; }
  .prod-row .pr small { display: block; color: var(--muted); font-size: 12px; }
  .stk { display: flex; align-items: center; gap: 6px; white-space: nowrap; font-size: 13px; color: var(--muted); }
  .stk b { color: var(--text); font-weight: 600; }
  .stk.low b { color: var(--danger); }
  .stk button { border: 1px solid var(--line-strong); background: none; color: var(--text); border-radius: 8px; padding: 4px 8px; font-size: 12px; min-height: 30px; }
  .badge { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: rgba(143,191,138,.18); color: var(--ok); }
  .badge.warn { background: rgba(224,122,106,.15); color: var(--danger); }
  .badge.muted { background: var(--surface-2); color: var(--muted); }
  .buy-sec { display: grid; gap: 6px; }
  .buy-sec label { display: flex; gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .buy-sec label input { width: 18px; height: 18px; accent-color: var(--accent); flex: none; }
  .buy-sec label .q { margin-left: auto; white-space: nowrap; color: var(--muted); font-size: 12px; }
  .exp-form { display: grid; grid-template-columns: 140px 1fr 120px 2fr auto; gap: 8px; align-items: end; }
  @media (max-width: 860px) { .exp-form { grid-template-columns: 1fr 1fr; } .exp-form .wide { grid-column: 1 / -1; } }
  .rcpt { background: #fff; color: #111; border-radius: 12px; padding: 20px; font-family: 'Courier New', monospace; font-size: 13px; line-height: 1.5; }
  .rcpt h3 { margin: 0; text-align: center; font-family: var(--font-deco); font-weight: 400; letter-spacing: .1em; }
  .rcpt .c { text-align: center; }
  .rcpt .ln { display: flex; justify-content: space-between; gap: 10px; }
  .rcpt hr { border: 0; border-top: 1px dashed #999; margin: 8px 0; }
  .rcpt .tot { font-weight: 700; font-size: 16px; }
  .wa-pick { display: grid; gap: 8px; }
  .wa-pick button { text-align: left; padding: 12px 14px; min-height: 52px; }
  .wa-pick small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; white-space: normal; }
  .switch { position: relative; width: 42px; height: 24px; flex: none; }
  .switch input { opacity: 0; width: 100%; height: 100%; margin: 0; position: absolute; cursor: pointer; z-index: 1; }
  .switch span { position: absolute; inset: 0; background: var(--surface-2); border-radius: 999px; transition: .2s; pointer-events: none; }
  .switch span::after { content: ''; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px; background: var(--muted); border-radius: 50%; transition: .2s; }
  .switch input:checked + span { background: var(--ok); }
  .switch input:checked + span::after { transform: translateX(18px); background: #fff; }

  dialog { border: 0; padding: 0; background: transparent; color: var(--text); max-width: none; max-height: none; }
  dialog::backdrop { background: rgba(0,0,0,.65); }
  .modal { width: min(640px, calc(100vw - 20px)); max-height: calc(100dvh - 20px); overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 22px; display: grid; gap: 14px; }
  .modal h2 { margin: 0; font-family: var(--font-display); font-weight: 500; font-size: 28px; display: flex; align-items: center; gap: 10px; }
  .modal h2 .x { margin-left: auto; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line-strong); background: none; font-size: 20px; font-family: var(--font-body); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  .full { grid-column: 1 / -1; }
  @media (max-width: 560px) { .grid3 { grid-template-columns: 1fr 1fr; } }
  .check { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
  .check input { width: 18px; height: 18px; accent-color: var(--accent); }
  .row-actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; padding-top: 6px; }
  .row-actions .danger { color: var(--danger); border-color: rgba(224,122,106,.4); margin-right: auto; }
  .photo-box { display: grid; grid-template-columns: 110px 1fr; gap: 14px; align-items: center; }
  .photo-box .pv { width: 110px; height: 110px; border-radius: 12px; background: var(--bg-2); overflow: hidden; display: grid; place-items: center; color: var(--faint); font-size: 12px; text-align: center; }
  .photo-box .pv img { width: 100%; height: 100%; object-fit: cover; }
  .item-row { display: grid; grid-template-columns: 1fr 80px 64px 90px 36px; gap: 8px; align-items: end; }
  .item-row .input { min-height: 40px; padding: 8px 10px; }
  .icon-btn { width: 36px; height: 40px; border: 1px solid var(--line); border-radius: 10px; background: none; color: var(--muted); }
  @media (max-width: 560px) { .item-row { grid-template-columns: 1fr 1fr 1fr 36px; } .item-row .pname { grid-column: 1 / -1; } }
  .stat-line { display: flex; gap: 18px; flex-wrap: wrap; color: var(--muted); font-size: 13px; }
  .stat-line b { color: var(--text); }
  .list-edit { display: grid; gap: 8px; }
  .list-edit .le { display: grid; grid-template-columns: 1fr auto auto auto auto; gap: 8px; align-items: center; }
  .faq-edit .fe { display: grid; gap: 6px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; }

  .login { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
  .login form { width: min(360px, 100%); display: grid; gap: 14px; text-align: center; }
  .login img { width: 160px; margin: 0 auto; }
  .err { color: var(--danger); font-size: 13px; min-height: 18px; }
  .center { display: grid; place-items: center; padding: 60px 0; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
  .hint { font-size: 12px; color: var(--faint); }
  .bar-cell { position: relative; }
  .sync { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); z-index: 300; background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); font-size: 12px; padding: 6px 12px; border-radius: 999px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .sync.show { opacity: 1; }
  .sync.done { color: var(--ok); }
  .bar-cell i { position: absolute; left: 0; top: 50%; height: 6px; transform: translateY(-50%); background: rgba(201,169,110,.35); border-radius: 3px; }
</style>
</head>
<body>
<div id="root"><div class="center" style="min-height:100vh"><div class="spinner"></div></div></div>
<dialog id="dlg"><div class="modal" id="dlgBody"></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="sync" id="sync" aria-live="polite"></div>
<datalist id="productList"></datalist>
<datalist id="brandList"></datalist>

<script src="config.js?v=4"></script>
<script>
(function () {
  'use strict';
  const API = (window.SP_CONFIG && window.SP_CONFIG.API_URL) || '';
  const $ = (s, el) => (el || document).querySelector(s);
  const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const money = n => Math.round(n || 0).toLocaleString('ru-RU').replace(/,/g, ' ') + ' ₸';
  const fmtNum = n => (Math.round((n || 0) * 10) / 10).toLocaleString('ru-RU');
  const ruDate = s => s ? s.slice(0, 10).split('-').reverse().join('.') + (s.length > 10 ? ' ' + s.slice(11, 16) : '') : '';
  const phoneFmt = p => /^7\d{10}$/.test(p) ? `+7 ${p.slice(1, 4)} ${p.slice(4, 7)}-${p.slice(7, 9)}-${p.slice(9)}` : (p || '');
  const normPhone = v => { let d = String(v || '').replace(/\D/g, ''); if (d.length === 11 && d[0] === '8') d = '7' + d.slice(1); if (d.length === 10) d = '7' + d; return /^7\d{10}$/.test(d) ? d : ''; };
  const today = () => new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Almaty' });
  const daysAgo = n => new Date(Date.now() - n * 864e5).toLocaleDateString('sv-SE', { timeZone: 'Asia/Almaty' });
  const ls = {
    get(k) { try { return localStorage.getItem('spa_' + k); } catch (e) { return null; } },
    set(k, v) { try { v == null ? localStorage.removeItem('spa_' + k) : localStorage.setItem('spa_' + k, v); } catch (e) {} }
  };

  const S = { token: ls.get('token'), data: null, tab: ls.get('tab') || 'dash', period: '30', orderFilter: 'Новый', q: {}, prodFilter: '', clientFilter: '' };

  const ICONS = {
    dash: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
    orders: '<path d="M6 3h12l2 4v13H4V7l2-4Z"/><path d="M4 7h16M9 11h6"/>',
    products: '<path d="M9 3h6v4H9zM10 7h4v2"/><path d="M12 9c-5 0-7 3-7 8v1c0 2 1 3 3 3h8c2 0 3-1 3-3v-1c0-5-2-8-7-8Z"/>',
    clients: '<circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M16 4a4 4 0 0 1 0 8M22 21c0-3-2-5-4-5.5"/>',
    promos: '<path d="M3 9V5h18v4a3 3 0 0 0 0 6v4H3v-4a3 3 0 0 0 0-6Z"/><path d="M14 5v14" stroke-dasharray="2 2"/>',
    settings: '<circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6a7 7 0 0 0 0 2.4l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.5-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2Z"/>'
  };
  ICONS.remind = '<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>';
  ICONS.money = '<rect x="2" y="6" width="20" height="13" rx="2"/><circle cx="12" cy="12.5" r="2.5"/><path d="M6 10v5M18 10v5"/>';
  ICONS.more = '<circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>';
  const TABS = [['dash', 'Аналитика'], ['orders', 'Заказы'], ['products', 'Товары'], ['clients', 'Клиенты'], ['remind', 'Напомнить'], ['money', 'Финансы'], ['promos', 'Промокоды'], ['settings', 'Настройки']];
  // На телефоне внизу помещаются только главные вкладки, остальные — под кнопкой «Ещё».
  const EXTRA_TABS = ['money', 'promos', 'settings'];
  const svgIcon = k => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${ICONS[k]}</svg>`;

  // ───────── API ─────────
  async function api(action, payload) {
    if (!API) throw new Error('Не указан API_URL в config.js');
    const res = await fetch(API, { method: 'POST', body: JSON.stringify(Object.assign({ action: action, token: S.token }, payload || {})) });
    const r = await res.json();
    if (!r.ok) {
      if (r.auth) { logout(true); }
      throw new Error(r.error || 'Ошибка');
    }
    return r;
  }
  async function reload(silent) {
    const r = await api('admin_data');
    applyData(r, silent);
  }

  function applyData(d, silent) {
    S.data = d;
    prepare();
    try { localStorage.setItem('spa_data', JSON.stringify(d)); } catch (e) { /* переполнено — работаем без кэша */ }
    if (silent) return;
    if ($('#dlg').open) S.renderAfterDialog = true; else render();
  }

  // Изменения применяются в интерфейсе сразу, а на сервер уходят в фоне.
  // Ответ сервера несёт свежие данные — подставляем их, когда завершится последняя операция.
  const sync = { pending: 0, data: null, failed: false };
  function mutate(action, payload, okMsg) {
    sync.pending++; showSync();
    return api(action, Object.assign({ with_data: true }, payload))
      .then(r => { if (r.data) sync.data = r.data; if (okMsg) toast(okMsg); return r; })
      .catch(e => { sync.failed = true; toast('Не сохранилось: ' + e.message, true); })
      .finally(() => {
        sync.pending--;
        if (!sync.pending) {
          if (sync.failed) reload().catch(() => {});
          else if (sync.data) applyData(sync.data);
          sync.data = null; sync.failed = false;
        }
        showSync();
      });
  }
  function showSync() {
    const el = $('#sync');
    el.textContent = sync.pending ? 'Синхронизация…' : 'Готово ✓';
    el.className = 'sync show' + (sync.pending ? '' : ' done');
    clearTimeout(showSync.t);
    if (!sync.pending) showSync.t = setTimeout(() => { el.className = 'sync'; }, 1500);
  }
  window.addEventListener('beforeunload', e => { if (sync.pending) { e.preventDefault(); e.returnValue = ''; } });
  async function run(btn, fn, okMsg) {
    if (btn) { btn.disabled = true; btn.dataset.t = btn.textContent; btn.textContent = 'Сохраняем…'; }
    try {
      await fn();
      if (okMsg) toast(okMsg);
      return true;
    } catch (e) {
      toast(e.message, true);
      return false;
    } finally {
      if (btn) { btn.disabled = false; btn.textContent = btn.dataset.t; }
    }
  }

  function prepare() {
    const d = S.data;
    d.byId = {};
    d.products.forEach(p => { d.byId[p.id] = p; });
    $('#productList').innerHTML = d.products.map(p => `<option value="${esc(p.brand + ' ' + p.name)}">`).join('');
    $('#brandList').innerHTML = [...new Set(d.products.map(p => p.brand).filter(Boolean))].sort().map(b => `<option value="${esc(b)}">`).join('');
    // Статистика клиентов
    const stats = {};
    d.sales.forEach(s => {
      if (!s.phone) return;
      const c = stats[s.phone] = stats[s.phone] || { orders: new Set(), spent: 0, ml: 0, last: '', products: {} };
      c.orders.add(s.order); c.spent += s.revenue; c.ml += s.ml;
      if (s.date > c.last) c.last = s.date;
      c.products[s.product] = (c.products[s.product] || 0) + s.ml;
    });
    d.clientStats = stats;
  }

  // ───────── Вход ─────────
  function renderLogin(msg) {
    $('#root').innerHTML = `<div class="login"><form id="loginForm">
      <img src="assets/logo.jpg" alt="SMELL PARFUME">
      <div style="font-family:var(--font-display);font-size:26px">Вход в админку</div>
      ${API ? '' : '<div class="err">Сначала укажите адрес API в файле config.js</div>'}
      <input class="input" type="password" name="password" placeholder="Пароль" autocomplete="current-password" required autofocus>
      <button class="btn btn-primary btn-block">Войти</button>
      <div class="err" id="loginErr">${esc(msg || '')}</div>
    </form></div>`;
    $('#loginForm').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = e.target.querySelector('button');
      btn.disabled = true; $('#loginErr').textContent = '';
      try {
        const r = await fetch(API, { method: 'POST', body: JSON.stringify({ action: 'login', password: e.target.password.value }) }).then(x => x.json());
        if (!r.ok) throw new Error(r.error);
        S.token = r.token; ls.set('token', r.token);
        $('#root').innerHTML = '';
        applyData(r.data);
      } catch (err) {
        $('#loginErr').textContent = err.message || 'Ошибка входа';
        btn.disabled = false;
      }
    });
  }
  function logout(expired) {
    if (S.token && !expired) api('logout').catch(() => {});
    S.token = null; ls.set('token', null); ls.set('data', null);
    renderLogin(expired ? 'Сессия истекла — войдите заново' : '');
  }

  // Пока админка открыта, раз в минуту тихо проверяем новые заказы: звук, уведомление, счётчик во вкладке.
  let audioCtx = null;
  document.addEventListener('click', () => {
    if (audioCtx) return;
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { /* без звука */ }
  }, { capture: true });
  function beep() {
    if (!audioCtx || ls.get('mute') === '1') return;
    try {
      audioCtx.resume();
      [0, .18].forEach((d, i) => {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain(), t = audioCtx.currentTime + d;
        o.type = 'sine'; o.frequency.value = i ? 1175 : 880;
        g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.3, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + .25);
        o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t + .3);
      });
    } catch (e) { /* без звука */ }
  }
  async function poll() {
    if (!S.token || !S.data || sync.pending) return;
    const before = new Set(S.data.orders.map(o => o.number));
    try {
      const r = await api('admin_data');
      if (sync.pending) return;
      const fresh = r.orders.filter(o => !before.has(o.number) && o.status === 'Новый' && o.source === 'сайт');
      applyData(r);
      if (fresh.length) {
        beep();
        toast(fresh.length === 1 ? `🔔 Новый заказ № ${fresh[0].number} — ${money(fresh[0].total)}` : `🔔 Новых заказов: ${fresh.length}`);
      }
    } catch (e) { /* нет сети — попробуем через минуту */ }
  }
  setInterval(poll, 60000);

  async function start() {
    if (!S.token) return renderLogin();
    // Сначала мгновенно показываем сохранённые данные, затем тихо подтягиваем свежие.
    let cached = null;
    try { cached = JSON.parse(ls.get('data') || 'null'); } catch (e) { /* битый кэш */ }
    if (cached) applyData(cached);
    else $('#root').innerHTML = '<div class="center" style="min-height:100vh"><div class="spinner"></div></div>';
    sync.pending++; showSync();
    try { await reload(); } catch (e) { if (S.token && !cached) renderLogin(e.message); }
    finally { sync.pending--; showSync(); }
  }

  // ───────── Каркас ─────────
  function render() {
    const newCount = S.data.orders.filter(o => o.status === 'Новый').length;
    if (!$('.app')) {
      $('#root').innerHTML = `<div class="app">
        <nav class="side">
          <div class="logo"><img src="assets/logo.jpg" alt=""><b>SMELL<br>PARFUME</b></div>
          ${TABS.map(t => `<button class="tab${EXTRA_TABS.includes(t[0]) ? ' extra' : ''}" data-tab="${t[0]}">${svgIcon(t[0])}<span>${t[1]}</span>${t[0] === 'orders' ? '<em class="count" id="newCount" style="font-style:normal"></em>' : t[0] === 'remind' ? '<em class="count" id="remindCount" style="font-style:normal"></em>' : ''}</button>`).join('')}
          <button class="tab more" id="moreBtn">${svgIcon('more')}<span>Ещё</span></button>
          <div class="bottom">
            <a class="tab" href="index.html" target="_blank">↗ Открыть сайт</a>
            <button class="tab" id="logoutBtn">Выйти</button>
          </div>
        </nav>
        <main id="main"></main>
      </div>`;
      $('.side').addEventListener('click', e => {
        const t = e.target.closest('[data-tab]');
        if (t) { S.tab = t.dataset.tab; ls.set('tab', S.tab); render(); window.scrollTo(0, 0); }
      });
      $('#logoutBtn').addEventListener('click', () => logout());
      $('#moreBtn').addEventListener('click', moreMenu);
      $('#main').addEventListener('click', onProductClick);
    }
    $$('.tab[data-tab]').forEach(t => t.classList.toggle('active', t.dataset.tab === S.tab));
    $('#moreBtn').classList.toggle('active', EXTRA_TABS.includes(S.tab));
    $('#newCount').textContent = newCount || '';
    $('#newCount').style.display = newCount ? '' : 'none';
    document.title = (newCount ? `(${newCount}) ` : '') + 'Админка — SMELL PARFUME';
    const rc = remindRows(), rn = rc.review.length + rc.repeat.length + rc.stock.length + rc.wish.length + rc.bonus.length + rc.bday.length;
    $('#remindCount').textContent = rn || '';
    $('#remindCount').style.display = rn ? '' : 'none';
    ({ dash: renderDash, orders: renderOrders, products: renderProducts, clients: renderClients, remind: renderRemind, money: renderMoney, promos: renderPromos, settings: renderSettings }[S.tab] || renderDash)();
  }

  function moreMenu() {
    openDlg(`<h2>Ещё<button class="x" data-x>×</button></h2>
      <div class="more-grid">
        ${TABS.filter(t => EXTRA_TABS.includes(t[0])).map(t => `<button class="btn" data-goto="${t[0]}">${svgIcon(t[0])}${t[1]}</button>`).join('')}
        <a class="btn" href="index.html" target="_blank">↗ Открыть сайт</a>
        <button class="btn" data-goto="logout">Выйти</button>
      </div>`);
    $('#dlgBody').addEventListener('click', e => {
      const b = e.target.closest('[data-goto]'); if (!b) return;
      closeDlg();
      if (b.dataset.goto === 'logout') return logout();
      S.tab = b.dataset.goto; ls.set('tab', S.tab); render(); window.scrollTo(0, 0);
    });
  }

  const head = (title, extra) => `<div class="head"><h1>${title}</h1>${extra || ''}<button class="btn btn-small" data-reload title="Обновить данные">↻</button></div>`;
  document.addEventListener('click', async e => {
    const r = e.target.closest('[data-reload]');
    if (r) { r.disabled = true; await run(null, () => reload(), 'Данные обновлены'); r.disabled = false; }
  });

  // ───────── Аналитика ─────────
  function periodRange() {
    const p = S.period, t = today();
    if (p === 'today') return [t, t];
    if (p === 'month') return [t.slice(0, 8) + '01', t];
    if (p === 'all') return ['0000', '9999'];
    return [daysAgo(Number(p) - 1), t];
  }

  function renderDash() {
    const d = S.data;
    const [from, to] = periodRange();
    const inP = s => { const x = (s || '').slice(0, 10); return x >= from && x <= to; };
    const sales = d.sales.filter(s => inP(s.date));
    const revenue = sales.reduce((a, s) => a + s.revenue, 0);
    const profit = sales.reduce((a, s) => a + s.profit, 0);
    const ml = sales.reduce((a, s) => a + s.ml, 0);
    const orderIds = new Set(sales.map(s => s.order + '|' + s.date.slice(0, 10)));
    const nOrders = orderIds.size;
    const orders = d.orders.filter(o => inP(o.date) && o.source === 'сайт');
    const byStatus = st => orders.filter(o => o.status === st).length;
    const sold = byStatus('Продано');
    const conv = orders.length ? Math.round(sold / orders.length * 100) : 0;
    const newClients = d.clients.filter(c => inP(c.created)).length;
    const spent = (d.expenses || []).filter(e => inP(e.date)).reduce((a, e) => a + e.amount, 0);
    const visitors = Object.keys(d.events.byDay).filter(inP).reduce((a, k) => a + d.events.byDay[k].visitors, 0);
    const views = Object.keys(d.events.byDay).filter(inP).reduce((a, k) => a + d.events.byDay[k].view, 0);

    // по дням
    const days = {};
    sales.forEach(s => { const k = s.date.slice(0, 10); days[k] = days[k] || { r: 0, p: 0 }; days[k].r += s.revenue; days[k].p += s.profit; });
    // топ ароматов
    const top = {};
    sales.forEach(s => { const t = top[s.product_id || s.product] = top[s.product_id || s.product] || { name: s.product, ml: 0, r: 0, p: 0 }; t.ml += s.ml; t.r += s.revenue; t.p += s.profit; });
    const topList = Object.values(top).sort((a, b) => b.r - a.r).slice(0, 10);
    const maxR = topList.length ? topList[0].r : 1;
    // интерес без покупок (за всё время)
    const soldMl = {};
    d.sales.forEach(s => { soldMl[s.product_id] = (soldMl[s.product_id] || 0) + s.ml; });
    const interest = Object.keys(d.events.byProduct).map(id => ({ id: id, p: d.byId[id], ...d.events.byProduct[id], sold: soldMl[id] || 0 }))
      .filter(x => x.p).sort((a, b) => (b.view + b.cart * 3) - (a.view + a.cart * 3)).slice(0, 10);
    // маржинальность
    const margins = d.products.filter(p => p.raw_price > 0).map(p => ({ p: p, m: (p.raw_price - p.cost) / p.raw_price })).sort((a, b) => a.m - b.m);

    $('#main').innerHTML = head('Аналитика', `<div class="chips">${[['today', 'Сегодня'], ['7', '7 дней'], ['30', '30 дней'], ['month', 'Этот месяц'], ['all', 'Всё время']].map(p => `<button class="chip ${S.period === p[0] ? 'active' : ''}" data-period="${p[0]}">${p[1]}</button>`).join('')}</div>`) + `
      <div class="kpis">
        <div class="kpi"><span>Выручка</span><b>${money(revenue)}</b><small>${nOrders} продаж</small></div>
        <div class="kpi"><span>Прибыль</span><b>${money(profit)}</b><small>маржа ${revenue ? Math.round(profit / revenue * 100) : 0}%</small></div>
        <div class="kpi"><span>Чистая прибыль</span><b style="color:${profit - spent < 0 ? 'var(--danger)' : 'inherit'}">${money(profit - spent)}</b><small>расходы ${money(spent)} · <a href="#" data-gomoney>внести</a></small></div>
        <div class="kpi"><span>Продано</span><b>${fmtNum(ml)} мл</b><small>средний чек ${money(nOrders ? revenue / nOrders : 0)}</small></div>
        <div class="kpi"><span>Заказы с сайта</span><b>${orders.length}</b><small>продано ${sold} · конверсия ${conv}%</small></div>
        <div class="kpi"><span>Посетители сайта</span><b>${visitors}</b><small>${views} просмотров ароматов</small></div>
        <div class="kpi"><span>Новые клиенты</span><b>${newClients}</b><small>всего ${d.clients.length}</small></div>
      </div>
      <div class="panel"><h2>Выручка и прибыль по дням</h2>${chart(days, from, to)}
        <div class="legend"><span><i style="background:var(--text)"></i>Выручка</span><span><i style="background:var(--accent)"></i>Прибыль</span></div></div>
      <div class="cols">
        <div class="panel"><h2>Топ ароматов <small>по выручке</small></h2>
          ${topList.length ? `<div class="tbl-wrap"><table><thead><tr><th>Аромат</th><th class="r">мл</th><th class="r">Выручка</th><th class="r">Прибыль</th></tr></thead><tbody>
          ${topList.map(t => `<tr><td class="bar-cell"><i style="width:${Math.round(t.r / maxR * 100)}%"></i><span style="position:relative">${esc(t.name)}</span></td><td class="r">${fmtNum(t.ml)}</td><td class="r">${money(t.r)}</td><td class="r">${money(t.p)}</td></tr>`).join('')}
          </tbody></table></div>` : '<div class="empty">Нет продаж за период</div>'}
        </div>
        <div class="panel"><h2>Заказы с сайта <small>за период</small></h2>
          <div class="tbl-wrap"><table><tbody>
            <tr><td><span class="status st-new">Новые</span></td><td class="r">${byStatus('Новый')}</td></tr>
            <tr><td><span class="status st-sold">Продано</span></td><td class="r">${sold}</td></tr>
            <tr><td><span class="status st-noans">Без ответа</span></td><td class="r">${byStatus('Без ответа')}</td></tr>
            <tr><td><span class="status st-cancel">Отменены</span></td><td class="r">${byStatus('Отменён')}</td></tr>
          </tbody></table></div>
          <p class="hint">«Без ответа» — нажали «Оформить», но так и не подтвердили. Если таких много, возможно, отпугивает цена или нужен звонок.</p>
        </div>
      </div>
      <div class="cols">
        <div class="panel"><h2>Интерес покупателей <small>за всё время</small></h2>
          ${interest.length ? `<div class="tbl-wrap"><table><thead><tr><th>Аромат</th><th class="r">Просмотры</th><th class="r">В корзину</th><th class="r">Продано мл</th></tr></thead><tbody>
          ${interest.map(x => `<tr><td>${esc(x.p.brand + ' ' + x.p.name)}</td><td class="r">${x.view}</td><td class="r">${x.cart}</td><td class="r">${fmtNum(x.sold)}</td></tr>`).join('')}
          </tbody></table></div><p class="hint">Много просмотров, но мало продаж — повод сделать акцию или добавить фото и описание.</p>` : '<div class="empty">Данные появятся, когда покупатели начнут заходить на сайт</div>'}
        </div>
        <div class="panel"><h2>Наименее маржинальные <small>цена vs закуп</small></h2>
          <div class="tbl-wrap"><table><thead><tr><th>Аромат</th><th class="r">Цена/мл</th><th class="r">Закуп</th><th class="r">Маржа</th></tr></thead><tbody>
          ${margins.slice(0, 8).map(x => `<tr><td>${esc(x.p.brand + ' ' + x.p.name)}</td><td class="r">${money(x.p.raw_price)}</td><td class="r">${money(x.p.cost)}</td><td class="r" style="color:${x.m < .4 ? 'var(--danger)' : 'inherit'}">${Math.round(x.m * 100)}%</td></tr>`).join('')}
          </tbody></table></div>
        </div>
      </div>`;
    $$('[data-period]').forEach(b => b.addEventListener('click', () => { S.period = b.dataset.period; renderDash(); }));
    $('[data-gomoney]').addEventListener('click', e => { e.preventDefault(); S.tab = 'money'; ls.set('tab', 'money'); render(); });
  }

  function chart(days, from, to) {
    let keys = Object.keys(days).sort();
    if (S.period !== 'all') {
      keys = [];
      for (let t = new Date(from + 'T12:00:00'); t.toISOString().slice(0, 10) <= to; t.setDate(t.getDate() + 1)) keys.push(t.toISOString().slice(0, 10));
    }
    if (!keys.length) return '<div class="empty">Нет данных</div>';
    const W = 800, H = 220, pad = 28, n = keys.length;
    const max = Math.max(1, ...keys.map(k => (days[k] || {}).r || 0));
    const bw = (W - pad) / n;
    const y = v => H - 22 - (v / max) * (H - 40);
    let bars = '';
    keys.forEach((k, i) => {
      const v = days[k] || { r: 0, p: 0 };
      const x = pad + i * bw;
      const w = Math.max(2, bw * .7);
      bars += `<rect x="${x + (bw - w) / 2}" y="${y(v.r)}" width="${w}" height="${H - 22 - y(v.r)}" rx="2" fill="var(--text)" opacity=".85"><title>${ruDate(k)}: ${money(v.r)} / прибыль ${money(v.p)}</title></rect>`;
      bars += `<rect x="${x + (bw - w) / 2}" y="${y(v.p)}" width="${w}" height="${H - 22 - y(v.p)}" rx="2" fill="var(--accent)" pointer-events="none"/>`;
    });
    const step = Math.ceil(n / 8);
    const labels = keys.map((k, i) => i % step === 0 ? `<text x="${pad + i * bw + bw / 2}" y="${H - 6}" text-anchor="middle" font-size="11" fill="var(--faint)">${k.slice(8, 10)}.${k.slice(5, 7)}</text>` : '').join('');
    const grid = [0, .5, 1].map(f => `<line x1="${pad}" x2="${W}" y1="${y(max * f)}" y2="${y(max * f)}" stroke="var(--line)"/><text x="0" y="${y(max * f) + 4}" font-size="10" fill="var(--faint)">${max * f >= 1000 ? Math.round(max * f / 1000) + 'k' : Math.round(max * f)}</text>`).join('');
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="График выручки по дням">${grid}${bars}${labels}</svg>`;
  }

  // ───────── Заказы ─────────
  const STATUS_CLS = { 'Новый': 'st-new', 'Продано': 'st-sold', 'Отменён': 'st-cancel', 'Без ответа': 'st-noans' };

  function renderOrders() {
    const d = S.data, f = S.orderFilter, q = (S.q.orders || '').toLowerCase();
    const counts = st => d.orders.filter(o => o.status === st).length;
    const quick = { '@today': o => o.date.slice(0, 10) === today(), '@unpaid': o => !o.paid && (o.status === 'Новый' || o.status === 'Продано'), '@work': o => o.status === 'Новый' || o.status === 'Без ответа' };
    const match = o => quick[f] ? quick[f](o) : !f || o.status === f;
    const list = d.orders.filter(o => match(o) && (!q || (o.number + ' ' + o.name + ' ' + o.surname + ' ' + o.phone + ' ' + o.items_text).toLowerCase().includes(q))).slice(0, 200);
    $('#main').innerHTML = head('Заказы', '<button class="btn btn-accent btn-small" id="manualBtn">+ Продажа вручную</button>') + `
      <div class="toolbar">
        <div class="chips">${[['@today', 'Сегодня'], ['@unpaid', 'Не оплачено'], ['@work', 'В работе']].map(c => `<button class="chip ${f === c[0] ? 'active' : ''}" data-of="${c[0]}">${c[1]} · ${d.orders.filter(quick[c[0]]).length}</button>`).join('')}</div>
        <div class="chips">${[['Новый', 'Новые'], ['Без ответа', 'Без ответа'], ['Продано', 'Продано'], ['Отменён', 'Отменены'], ['', 'Все']].map(c => `<button class="chip ${f === c[0] ? 'active' : ''}" data-of="${c[0]}">${c[1]}${c[0] ? ' · ' + counts(c[0]) : ''}</button>`).join('')}</div>
        <input class="input" id="orderSearch" type="search" placeholder="Поиск: номер, имя, телефон" value="${esc(S.q.orders || '')}">
      </div>
      <div id="orderList">${list.length ? list.map(orderCard).join('') : '<div class="empty">Заказов нет</div>'}</div>`;
    $$('[data-of]').forEach(b => b.addEventListener('click', () => { S.orderFilter = b.dataset.of; renderOrders(); }));
    $('#orderSearch').addEventListener('input', e => { S.q.orders = e.target.value; const pos = e.target.selectionStart; renderOrders(); const i = $('#orderSearch'); i.focus(); i.setSelectionRange(pos, pos); });
    $('#manualBtn').addEventListener('click', () => orderEditor(null));
    $('#orderList').addEventListener('click', onOrderAction);
  }

  function orderCard(o) {
    const client = [o.name, o.surname].filter(Boolean).join(' ') || 'Без имени';
    return `<div class="order" data-num="${esc(o.number)}">
      <div class="top"><span class="num">№ ${esc(o.number)}</span><span class="status ${STATUS_CLS[o.status] || 'st-noans'}">${esc(o.status)}</span>
        <span class="muted">${ruDate(o.date)}${o.source === 'вручную' ? ' · вручную' : ''}</span>${o.paid ? '<span class="badge">оплачен</span>' : o.status !== 'Отменён' ? '<span class="badge muted">не оплачен</span>' : ''}${o.receipt ? `<span class="badge muted">чек ${esc(o.receipt)}</span>` : ''}<b style="margin-left:auto;font-size:16px">${money(o.total)}</b></div>
      <div><b>${esc(client)}</b>${o.phone ? ` · <a href="https://wa.me/${o.phone}" target="_blank" rel="noopener">${phoneFmt(o.phone)}</a>` : ''}</div>
      <div class="items">${(o.items.length ? o.items : []).map(it => it.gift
          ? `<div>🎁 ${esc(it.name)}${it.qty > 1 ? ' × ' + it.qty : ''} · ${money(lineSum(it))}</div>`
          : `<div>${esc(it.name)} — ${fmtNum(it.ml)} мл${it.qty > 1 ? ' × ' + it.qty : ''}${it.set ? ` <span class="muted">(набор «${esc(it.set)}»)</span>` : ''}${it.sample ? ' <span class="muted">(🎁 подарок)</span>' : ''} · ${money(lineSum(it))}</div>`).join('') || esc(o.items_text)}
        ${o.discount ? `<div>Скидка${o.loyalty ? ' постоянного клиента (' + esc(o.loyalty) + ')' : o.promo ? ' (' + esc(o.promo) + ')' : ''}: −${money(o.discount)}</div>` : ''}
        ${o.gift_codes ? `<div style="color:var(--accent)">🎁 Коды сертификатов: <b style="user-select:all">${esc(o.gift_codes)}</b> — отправьте покупателю</div>` : ''}
        ${!o.gift_codes && o.status === 'Продано' && o.items.some(it => it.gift) ? '<div class="muted">🎁 Коды сертификатов создаются…</div>' : ''}
        ${o.comment ? `<div style="color:var(--text)">💬 ${esc(o.comment)}</div>` : ''}</div>
      <div class="actions">
        ${o.status !== 'Продано' ? '<button class="btn btn-small btn-accent" data-act="sold">✓ Продано</button>' : '<button class="btn btn-small" data-act="new">Вернуть в «Новый»</button>'}
        ${o.status !== 'Отменён' && o.status !== 'Продано' ? '<button class="btn btn-small" data-act="cancel">✕ Отменён</button>' : ''}
        ${o.status !== 'Продано' ? '<button class="btn btn-small" data-act="edit">Изменить</button>' : ''}
        ${o.status !== 'Отменён' ? `<button class="btn btn-small" data-act="paid">${o.paid ? '✓ Оплачено' : '₸ Оплачено'}</button>` : ''}
        ${o.status === 'Продано' || o.paid ? '<button class="btn btn-small" data-act="receipt">🧾 Чек</button>' : ''}

    </div>`;

  async function onOrderAction(e) {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const num = b.closest('[data-num]').dataset.num;
    const act = b.dataset.act;
    if (act === 'edit') return orderEditor(S.data.orders.find(o => o.number === num));
    const ord = S.data.orders.find(o => o.number === num);
    if (act === 'wa') return waPicker(ord);
    if (act === 'receipt') return receiptDialog(ord);
    if (act === 'paid') {
      if (ord.paid && !confirm('Снять отметку «Оплачено»?')) return;
      ord.paid = ord.paid ? '' : today() + ' ' + new Date().toLocaleTimeString('ru-RU', { timeZone: 'Asia/Almaty', hour: '2-digit', minute: '2-digit' });
      render();
      return mutate('order_paid', { number: num, paid: !!ord.paid }, ord.paid ? `№ ${num} — оплачено` : 'Отметка снята');
    }
    if (act === 'new' && !confirm('Вернуть заказ в «Новый»? Продажа будет удалена из аналитики.')) return;
    const status = { sold: 'Продано', cancel: 'Отменён', new: 'Новый' }[act];
    const order = S.data.orders.find(o => o.number === num);
    order.status = status;
    render();
    toast(status === 'Продано' ? `№ ${num} — продано` : `№ ${num} — ${status.toLowerCase()}`);
    mutate('order_status', { number: num, status: status });
  }

  const lineSum = it => it.gift ? it.price * (it.qty || 1) : it.price * it.ml * (it.qty || 1);

  // ───────── Сообщения по заказу ─────────

  const DEF_WA_READY = 'Здравствуйте, {имя}! Это SMELL PARFUME 🌿 Ваш заказ № {номер} собран: {аромат}. Сумма: {сумма}. Скоро свяжемся по доставке 🙌';
  const DEF_WA_COURIER = 'Здравствуйте, {имя}! Курьер с вашим заказом № {номер} уже выехал 🚗 Сумма к оплате: {сумма}. Хорошего дня!';
  const DEF_WA_PAID = 'Здравствуйте, {имя}! Оплату {сумма} по заказу № {номер} получили, спасибо 🙏 Будем рады видеть вас снова!';
  const fillOrder = (tpl, o) => fillText(tpl.replace(/\{номер\}/g, o.number).replace(/\{сумма\}/g, money(o.total)), o, {});
  function waPicker(o) {
    const s = S.data.settings;
    const opts = [['ready', 'Заказ собран', s.wa_ready_text || DEF_WA_READY], ['courier', 'Курьер выехал', s.wa_courier_text || DEF_WA_COURIER],
      ['paid', 'Оплата получена', s.wa_paid_text || DEF_WA_PAID], ['plain', 'Просто написать', DEF_WA_ORDER]];
    openDlg(`<h2>WhatsApp · № ${esc(o.number)}<button class="x" data-x>×</button></h2>
      <div class="wa-pick">${opts.map(x => `<button class="btn" data-wa="${x[0]}"><b>${x[1]}</b><small>${esc(fillOrder(x[2], o))}</small></button>`).join('')}</div>
      <p class="hint" style="margin:0">Тексты меняются в «Настройках» → «Сообщения по заказу».</p>`);
    $('#dlgBody').addEventListener('click', e => {
      const b = e.target.closest('[data-wa]'); if (!b) return;
      const tpl = opts.find(x => x[0] === b.dataset.wa)[2];
      window.open('https://wa.me/' + o.phone + '?text=' + encodeURIComponent(fillOrder(tpl, o)), '_blank', 'noopener');
      closeDlg();

  // ───────── Чек: сохраняется в лист «Чеки» ─────────
  const PAYMENTS = ['Kaspi', 'Наличные', 'Перевод', 'Карта'];
  function receiptHtml(r, o) {
    const items = o && o.items.length ? o.items.map(it => it.gift
      ? [it.name + (it.qty > 1 ? ' × ' + it.qty : ''), lineSum(it)]
      : [it.name + ' ' + fmtNum(it.ml) + ' мл' + (it.qty > 1 ? ' × ' + it.qty : '') + (it.sample ? ' (подарок)' : ''), lineSum(it)]) : null;
    return `<div class="rcpt">
      <h3>SMELL PARFUME</h3><div class="c">парфюм на разлив · ${esc(S.data.settings.city || '')}</div><hr>
      <div class="ln"><span>Чек</span><b>${esc(r.number)}</b></div>
      <div class="ln"><span>Дата</span><span>${ruDate(r.date)}</span></div>
      <div class="ln"><span>Заказ</span><span>№ ${esc(r.order)}</span></div>
      ${r.client ? `<div class="ln"><span>Покупатель</span><span>${esc(r.client)}</span></div>` : ''}
      <hr>${items ? items.map(x => `<div class="ln"><span>${esc(x[0])}</span><span>${money(x[1])}</span></div>`).join('') : `<div>${esc(r.items_text)}</div>`}
      <hr>${r.discount ? `<div class="ln"><span>Сумма</span><span>${money(r.subtotal)}</span></div><div class="ln"><span>Скидка</span><span>−${money(r.discount)}</span></div>` : ''}
      <div class="ln tot"><span>ИТОГО</span><span>${money(r.total)}</span></div>
      <div class="ln"><span>Оплата</span><span>${esc(r.payment)}</span></div><hr>
      <div class="c">Спасибо за покупку! 🖤<br>smellparfume.github.io</div></div>`;
  }
  const receiptText = (r, o) => `SMELL PARFUME — чек ${r.number}\nЗаказ № ${r.order} от ${ruDate(r.date)}\n\n`
    + (o && o.items.length ? o.items.map(it => '• ' + it.name + (it.gift ? '' : ' ' + fmtNum(it.ml) + ' мл') + (it.qty > 1 ? ' × ' + it.qty : '') + ' — ' + money(lineSum(it))).join('\n') : r.items_text)
    + (r.discount ? `\nСкидка: −${money(r.discount)}` : '') + `\nИтого: ${money(r.total)}\nОплата: ${r.payment}\n\nСпасибо за покупку! 🖤`;
  function printHtml(title, body) {

    w.document.write(`<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>${esc(title)}</title><style>
      body{font-family:Arial,sans-serif;color:#111;margin:24px;font-size:13px} h1{font-size:22px;margin:0 0 4px} h2{font-size:15px;margin:22px 0 8px}

      const guess = /наличн/i.test(o.comment || '') ? 'Наличные' : 'Kaspi';
      openDlg(`<h2>Чек · № ${esc(o.number)}<button class="x" data-x>×</button></h2>
        <p class="muted" style="margin:0">Чек получит номер и сохранится в таблице (лист «Чеки»). Сумма: <b>${money(o.total)}</b></p>
        <label class="field"><span>Способ оплаты</span><select class="select" id="rcPay">${PAYMENTS.map(x => `<option ${x === guess ? 'selected' : ''}>${x}</option>`).join('')}</select></label>
        <div class="row-actions"><button class="btn" data-x>Отмена</button><button class="btn btn-accent" id="rcMake">Создать чек</button></div>`);
      $('#rcMake').addEventListener('click', async e => {
        e.target.disabled = true; e.target.textContent = 'Создаём…';
        const res = await mutate('make_receipt', { number: o.number, payment: $('#rcPay').value });
        const fresh = S.data.orders.find(x => x.number === o.number);
        if (res && res.receipt && fresh) {
          fresh.receipt = res.receipt;
          // Если свежие данные с сервера ещё не пришли (идут другие сохранения) — показываем чек из заказа.
          S.data.receipts = S.data.receipts || [];
          if (!S.data.receipts.some(x => x.number === res.receipt)) S.data.receipts.push({ number: res.receipt, order: fresh.number, date: today() + ' ' + new Date().toLocaleTimeString('ru-RU', { timeZone: 'Asia/Almaty', hour: '2-digit', minute: '2-digit' }),
            client: [fresh.name, fresh.surname].filter(Boolean).join(' '), phone: fresh.phone, items_text: fresh.items_text, subtotal: fresh.subtotal, discount: fresh.discount, total: fresh.total, payment: $('#rcPay').value, created: today() });
          receiptDialog(fresh);
        }
        else closeDlg();
      });
      return;
    }
    openDlg(`<h2>Чек ${esc(r.number)}<button class="x" data-x>×</button></h2>${receiptHtml(r, o)}
      <div class="row-actions">
        ${r.phone ? '<button class="btn" id="rcWa" style="background:#25d366;border-color:#25d366;color:#0b2e17">Отправить в WhatsApp</button>' : ''}
        <button class="btn btn-accent" id="rcPrint">Печать / PDF</button>
      </div>`);
    $('#rcPrint').addEventListener('click', () => printHtml('Чек ' + r.number, receiptHtml(r, o)));
    if ($('#rcWa')) $('#rcWa').addEventListener('click', () => window.open('https://wa.me/' + r.phone + '?text=' + encodeURIComponent(receiptText(r, o)), '_blank', 'noopener'));
  }

  function findProductByLabel(label) {
    label = String(label || '').trim().toLowerCase();
    return S.data.products.find(p => (p.brand + ' ' + p.name).toLowerCase() === label);
  }

  function itemRow(it) {
    const p = it && S.data.byId[it.id];
    return `<div class="item-row">
      <label class="field pname"><span>Аромат</span><input class="input" list="productList" data-f="product" value="${esc(p ? p.brand + ' ' + p.name : '')}" placeholder="Начните вводить"></label>
      <label class="field"><span>мл</span><input class="input" type="number" min="0.5" step="0.5" data-f="ml" value="${it ? it.ml : 10}"></label>
      <label class="field"><span>шт</span><input class="input" type="number" min="1" step="1" data-f="qty" value="${it ? it.qty || 1 : 1}"></label>
      <label class="field"><span>₸ за мл</span><input class="input" type="number" min="0" data-f="price" value="${it ? it.price : ''}" placeholder="авто"></label>
      <button class="icon-btn" data-rm title="Убрать">✕</button>
    </div>`;
  }

  function orderEditor(o) {
    const isNew = !o;
    const gifts = o ? o.items.filter(it => it.gift) : [];
    openDlg(`<h2>${isNew ? 'Продажа вручную' : 'Заказ № ' + esc(o.number)}<button class="x" data-x>×</button></h2>
      <div class="grid3">
        <label class="field"><span>Телефон</span><input class="input" name="phone" value="${esc(o ? o.phone : '')}" placeholder="+7…" inputmode="tel"></label>
        <label class="field"><span>Имя</span><input class="input" name="name" value="${esc(o ? o.name : '')}"></label>
        <label class="field"><span>Фамилия</span><input class="input" name="surname" value="${esc(o ? o.surname : '')}"></label>
      </div>
      ${gifts.length ? `<div class="hint" style="font-size:13px;color:var(--text)">🎁 ${gifts.map(g => esc(g.name) + (g.qty > 1 ? ' × ' + g.qty : '')).join(', ')} — останутся в заказе</div>` : ''}
      <div id="items" style="display:grid;gap:10px">${(o ? o.items.filter(it => !it.gift) : [null]).map(itemRow).join('')}</div>
      <button class="btn btn-small" id="addItem" style="justify-self:start">+ Ещё аромат</button>
      <div class="grid3">
        <label class="field"><span>Скидка, ₸</span><input class="input" type="number" min="0" name="discount" value="${o ? o.discount : 0}"></label>
        ${isNew ? `<label class="field"><span>Дата</span><input class="input" type="datetime-local" name="date" value="${new Date(Date.now() + 5 * 36e5).toISOString().slice(0, 16)}"></label>` : ''}
        <div class="field"><span>Итого</span><b id="edTotal" style="font-size:20px;padding-top:8px">—</b></div>
      </div>
      <label class="field"><span>Комментарий</span><input class="input" name="comment" value="${esc(o ? o.comment : '')}"></label>
      <p class="hint" style="margin:0">Цена «авто» = текущая цена аромата (с учётом акции). Если клиент не нужен — оставьте телефон пустым.</p>
      <div class="row-actions">
        <button class="btn" data-x>Отмена</button>
        <button class="btn btn-accent" id="saveOrder">${isNew ? 'Записать продажу' : 'Сохранить'}</button>
      </div>`);
    const box = $('#dlgBody');
    const collect = () => $$('.item-row', box).map(r => {
      const p = findProductByLabel($('[data-f=product]', r).value);
      const priceVal = $('[data-f=price]', r).value;
      return p ? { id: p.id, ml: Number($('[data-f=ml]', r).value), qty: Number($('[data-f=qty]', r).value) || 1, price: priceVal === '' ? (p.sale_price || p.raw_price) : Number(priceVal) } : null;
    });
    const recalc = () => {
      const items = collect().filter(Boolean).concat(gifts);
      const st = items.reduce((s, it) => s + lineSum(it), 0);
      $('#edTotal').textContent = money(Math.max(0, st - Number(box.querySelector('[name=discount]').value || 0)));
    };
    box.addEventListener('input', recalc);
    box.addEventListener('click', e => {
      if (e.target.closest('[data-rm]')) { e.target.closest('.item-row').remove(); recalc(); }
    });
    $('#addItem').addEventListener('click', () => { $('#items').insertAdjacentHTML('beforeend', itemRow(null)); });
    recalc();
    $('#saveOrder').addEventListener('click', async e => {
      const picked = collect();
      if (picked.some(x => !x)) return toast('Выберите аромат из списка подсказок', true);
      const raw = picked.concat(gifts);
      if (!raw.length) return toast('Добавьте аромат', true);
      const phoneRaw = box.querySelector('[name=phone]').value;
      if (phoneRaw && !normPhone(phoneRaw)) return toast('Проверьте телефон', true);
      const payload = {
        items: raw, discount: Number(box.querySelector('[name=discount]').value || 0), comment: box.querySelector('[name=comment]').value,
        phone: phoneRaw, name: box.querySelector('[name=name]').value, surname: box.querySelector('[name=surname]').value
      };
      const subtotal = raw.reduce((s, it) => s + lineSum(it), 0);
      const items = raw.map(it => it.gift ? it : Object.assign({ name: S.data.byId[it.id].brand + ' ' + S.data.byId[it.id].name }, it));
      if (isNew) {
        const date = box.querySelector('[name=date]').value;
        S.data.orders.unshift({ number: '…', date: date.replace('T', ' '), status: 'Продано', phone: normPhone(phoneRaw), name: payload.name, surname: payload.surname,
          items: items, items_text: '', subtotal: subtotal, promo: '', discount: payload.discount, total: subtotal - payload.discount, comment: payload.comment, source: 'вручную' });
        mutate('manual_sale', Object.assign(payload, { date: date }), 'Продажа записана');
      } else {
        Object.assign(o, { items: items, subtotal: subtotal, total: subtotal - payload.discount, discount: payload.discount, comment: payload.comment,
          phone: normPhone(phoneRaw) || o.phone, name: payload.name, surname: payload.surname });
        mutate('order_update', Object.assign(payload, { number: o.number }), 'Заказ обновлён');
      }
      closeDlg(); render();
    });
  }

  // ───────── Товары ─────────
  function renderProducts() {
    const d = S.data, q = (S.q.products || '').toLowerCase(), f = S.prodFilter;
    const list = d.products.filter(p => {
      if (f === 'in' && !p.in_stock) return false;
      if (f === 'out' && p.in_stock) return false;
      if (f === 'sale' && !p.sale_percent_raw) return false;
      if (f === 'nophoto' && p.photo) return false;
      if (f === 'low' && !isLow(p)) return false;
      return !q || (p.brand + ' ' + p.name).toLowerCase().includes(q);
    });
    const nLow = d.products.filter(isLow).length;
    $('#main').innerHTML = head('Товары', '<button class="btn btn-small" id="buyBtn">🛒 Список закупки</button><button class="btn btn-small" id="invBtn">Инвентаризация</button><button class="btn btn-accent btn-small" id="addProduct">+ Добавить аромат</button>') + `
      <div class="toolbar">
        <input class="input" id="prodSearch" type="search" placeholder="Поиск по названию или бренду" value="${esc(S.q.products || '')}">
        <div class="chips">${[['', 'Все'], ['in', 'В наличии'], ['out', 'Нет в наличии'], ['low', 'Заканчиваются' + (nLow ? ' · ' + nLow : '')], ['sale', 'Акции'], ['nophoto', 'Без фото']].map(c => `<button class="chip ${f === c[0] ? 'active' : ''}" data-pf="${c[0]}">${c[1]}</button>`).join('')}</div>
      </div>
      <div class="panel" style="padding:4px 14px">
        ${list.map(p => `<div class="prod-row" data-id="${esc(p.id)}">
          <div class="th">${p.photo ? `<img src="${esc(p.photo)}" alt="" loading="lazy">` : esc((p.brand || '?')[0])}</div>
          <div class="nm">${esc(p.name)}<small>${esc(p.brand)} · ${esc(p.gender)}${p.sections.length ? ' · ' + esc(p.sections.join(', ')) : ''}</small></div>
          <div class="pr">${p.sale_percent ? `<span style="color:var(--accent)">−${p.sale_percent}%</span> ` : ''}${money(p.raw_price)}<small>закуп ${money(p.cost)}</small></div>
          <div class="stk${isLow(p) ? ' low' : ''}" title="Остаток во флаконе">${p.stock == null ? '<span>учёт не ведётся</span>' : `<b>${fmtNum(p.stock)} мл</b>`}<button data-restock title="Купили ещё 50 мл">+50 мл</button></div>
          <label class="switch" title="В наличии" data-stock><input type="checkbox" ${p.in_stock ? 'checked' : ''}><span></span></label>
        </div>`).join('') || '<div class="empty">Ничего не найдено</div>'}
      </div>
      <p class="hint">Переключатель справа — наличие. «+50 мл» — докупили флакон. Остаток уменьшается сам при «Продано»; на нуле аромат сам станет «нет в наличии». Нажмите на аромат, чтобы изменить цену, фото, остаток, акцию.</p>`;
    $('#prodSearch').addEventListener('input', e => { S.q.products = e.target.value; const pos = e.target.selectionStart; renderProducts(); const i = $('#prodSearch'); i.focus(); i.setSelectionRange(pos, pos); });
    $$('[data-pf]').forEach(b => b.addEventListener('click', () => { S.prodFilter = b.dataset.pf; renderProducts(); }));
    $('#addProduct').addEventListener('click', () => productEditor(null));
    $('#buyBtn').addEventListener('click', buyList);
    $('#invBtn').addEventListener('click', inventory);
  }

  const lowLimit = () => { const v = S.data.settings.stock_low; return v === '' || v == null ? 30 : Number(v) || 0; };
  const isLow = p => p.stock != null && p.stock <= lowLimit();

  // Список закупки: что заканчивается + кого ждут клиенты + что хорошо продаётся.
  function buyList() {
    const d = S.data, days = Number(d.settings.buy_days) || 30, from = daysAgo(days - 1);
    const sold = {};
    d.sales.filter(s => s.date.slice(0, 10) >= from).forEach(s => { if (s.product_id) sold[s.product_id] = (sold[s.product_id] || 0) + s.ml; });
    const name = p => (p.brand + ' ' + p.name).trim();
    const step = ml => Math.max(50, Math.ceil(ml / 50) * 50);
    const used = new Set(), wn = {};
    (d.waitlist || []).filter(w => !w.notified && w.product_id).forEach(w => { wn[w.product_id] = (wn[w.product_id] || 0) + 1; });
    const low = d.products.filter(isLow).sort((a, b) => a.stock - b.stock).map(p => {
      used.add(p.id);
      return { key: p.id, text: name(p), note: `осталось ${fmtNum(p.stock)} мл · продано ${fmtNum(sold[p.id] || 0)} мл за ${days} дн.${wn[p.id] ? ' · ждут ' + wn[p.id] + ' чел.' : ''}`, ml: step((sold[p.id] || 0) - p.stock), on: true };
    });
    const waitsBy = {};
    (d.waitlist || []).filter(w => !w.notified).forEach(w => { const k = w.product_id || ('?' + w.product); waitsBy[k] = waitsBy[k] || { id: w.product_id, text: w.product, n: 0 }; waitsBy[k].n++; });
    const waits = Object.values(waitsBy).filter(w => !used.has(w.id) && (!w.id || !(d.byId[w.id] && d.byId[w.id].in_stock))).sort((a, b) => b.n - a.n).map(w => {
      if (w.id) used.add(w.id);
      return { key: w.id || w.text, text: w.text, note: `ждут ${w.n} чел.${w.id ? '' : ' · нет на сайте'}`, ml: 50, on: true };
    });
    const top = Object.keys(sold).filter(id => d.byId[id] && !used.has(id)).sort((a, b) => sold[b] - sold[a]).slice(0, 10).map(id => {
      const p = d.byId[id];

  function resizeImage(file, max) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/jpeg', 0.86).split(',')[1]);
        URL.revokeObjectURL(img.src);
      };
      img.onerror = () => reject(new Error('Не удалось прочитать картинку'));
      img.src = URL.createObjectURL(file);
    });
  }

  // День рождения «ДД.ММ» или «ДД.ММ.ГГГГ»: через сколько дней (0 — сегодня), null — не указан.
  function bdayLeft(b) {
    const m = /^(\d{2})\.(\d{2})/.exec(b || ''); if (!m) return null;
    for (let i = 0; i <= 366; i++) { const t = daysAgo(-i); if (t.slice(8, 10) === m[1] && t.slice(5, 7) === m[2]) return i; }
    return null;
  }
  const bdayIn = (b, days) => { const n = bdayLeft(b); return n !== null && n <= days; };
  const normBday = v => {
    v = String(v || '').trim(); if (!v) return '';
    const m = /^(\d{1,2})[.\/-](\d{1,2})(?:[.\/-](\d{4}))?$/.exec(v);
    if (!m || +m[1] < 1 || +m[1] > 31 || +m[2] < 1 || +m[2] > 12) return null;
    return ('0' + m[1]).slice(-2) + '.' + ('0' + m[2]).slice(-2) + (m[3] ? '.' + m[3] : '');
  };

  // ───────── Напоминания: отзыв и повторная покупка ─────────
  const aromaSum = items => (items || []).filter(it => !it.gift).reduce((a, it) => a + lineSum(it), 0);
  function remindRows() {
    const d = S.data, s = d.settings;
    const rd = Number(s.review_days) || 3, pd = Number(s.repeat_days) || 30;
    const sold = d.orders.filter(o => o.status === 'Продано' && /^7\d{10}$/.test(o.phone));
    const reviewed = new Set((d.reviews || []).map(r => r.order).filter(Boolean));
    const review = sold.filter(o => { const day = o.date.slice(0, 10); return !o.review_asked && day <= daysAgo(rd) && day >= daysAgo(rd + 30) && !reviewed.has(o.number); });
    const last = {};
    sold.forEach(o => { if (!last[o.phone] || o.date > last[o.phone].date) last[o.phone] = o; });
    const clients = {};
    d.clients.forEach(c => { clients[c.phone] = c; });
    const repeat = Object.values(last).filter(o => {
      const day = o.date.slice(0, 10), c = clients[o.phone];
      return day <= daysAgo(pd) && day >= daysAgo(pd + 150) && !(c && c.reminded && c.reminded.slice(0, 10) >= day);
    }).sort((a, b) => a.date.localeCompare(b.date));
    // Ждали аромат, и он появился в наличии
    const inStock = new Set(d.products.filter(p => p.in_stock).map(p => p.id));
    const waits = (d.waitlist || []).filter(w => !w.notified);
    const stock = waits.filter(w => inStock.has(w.product_id));
    // «Не нашли аромат?» — без id, аромата нет на сайте
    const wish = waits.filter(w => !w.product_id);
    const waitingOut = {};
    waits.filter(w => w.product_id && !inStock.has(w.product_id)).forEach(w => { waitingOut[w.product] = (waitingOut[w.product] || 0) + 1; });
    // Друг купил по коду — бонус-промокод создан, осталось сообщить владельцу кода
    const bonus = d.orders.filter(o => o.ref_bonus && !o.ref_sent).map(o => {
      const p = d.promos.find(x => x.code === o.ref_bonus), c = p && clients[p.phone];
      return p ? { order: o, code: p.code, value: p.value, phone: p.phone, name: c ? c.name : '', surname: c ? c.surname : '' } : null;
    }).filter(Boolean);
    const bd = s.bday_days === '' || s.bday_days == null ? 3 : Number(s.bday_days) || 0;
    const bday = d.clients.filter(c => bdayIn(c.birthday, bd) && !(c.bday_sent && c.bday_sent >= daysAgo(60)))
      .sort((a, b) => bdayLeft(a.birthday) - bdayLeft(b.birthday));
    return { review: review, repeat: repeat, stock: stock, wish: wish, waitingOut: waitingOut, bonus: bonus, bday: bday };
  }
  const aromasOf = o => [...new Set((o.items || []).filter(it => !it.gift).map(it => it.name))].join(', ') || 'аромат';
  // Подставляем {имя} {аромат} {ссылка} {скидка}; без имени «Здравствуйте, {имя}!» превращается в «Здравствуйте!»
  function fillText(tpl, o, extra) {
    const name = (o.name || '').trim();
    return tpl.replace(/,?\s*\{имя\}/g, name ? ', ' + name : '').replace(/\{аромат\}/g, aromasOf(o))
      .replace(/\{ссылка\}/g, extra.link || '').replace(/\{код\}/g, extra.code || '').replace(/\s*\{скидка\}/g, extra.loy ? ' ' + extra.loy : '').trim();
  }
  function loyaltyNote(phone) {
    const s = S.data.settings, every = Math.floor(Number(s.loyalty_every) || 0), pct = Number(s.loyalty_percent) || 0, min = Number(s.loyalty_min) || 0;
    if (every < 2 || pct <= 0) return '';

  function translit(s) {
    const m = { а: 'a', б: 'b', в: 'v', г: 'g', д: 'd', е: 'e', ё: 'e', ж: 'zh', з: 'z', и: 'i', й: 'y', к: 'k', л: 'l', м: 'm', н: 'n', о: 'o', п: 'p', р: 'r', с: 's', т: 't', у: 'u', ф: 'f', х: 'h', ц: 'c', ч: 'ch', ш: 'sh', щ: 'sch', ы: 'y', э: 'e', ю: 'yu', я: 'ya', ә: 'a', ғ: 'g', қ: 'k', ң: 'n', ө: 'o', ұ: 'u', ү: 'u', һ: 'h', і: 'i' };
    return String(s).toLowerCase().split('').map(ch => m[ch] !== undefined ? m[ch] : ch).join('');
  }

        mutate('save_promo', { promo: p, old_code: p.code }, p.active ? 'Промокод включён' : 'Промокод выключен');
        return;
      }
      promoEditor(p);
    }));
  }

    p = p || { code: '', type: '%', value: 10, until: '', limit: '', phone: '', active: true, comment: '' };
    openDlg(`<h2>${isNew ? 'Новый промокод' : esc(p.code)}<button class="x" data-x>×</button></h2>

      </div>
      <label class="check"><input type="checkbox" name="active" ${p.active ? 'checked' : ''}> Активен</label>
      ${isNew ? '' : `<p class="hint" style="margin:0">Использован: ${p.used} раз (считаются только заказы со статусом «Продано»).</p>`}
      <div class="row-actions">
        ${isNew ? '' : '<button class="btn danger" id="delPromo">Удалить</button>'}

      const promo = { code: g('code').value.trim().toUpperCase().replace(/\s+/g, ''), type: g('type').value, value: Number(g('value').value), until: g('until').value, limit: g('limit').value === '' ? '' : Number(g('limit').value), phone: normPhone(phoneRaw), active: g('active').checked, comment: g('comment').value };
      if (!/^[A-ZА-ЯЁ0-9_-]{3,30}$/.test(promo.code)) return toast('Код: 3–30 букв или цифр без пробелов', true);
      if (!(promo.value > 0)) return toast('Укажите размер скидки', true);
      if (S.data.promos.some(x => x.code === promo.code && x.code !== p.code)) return toast('Такой промокод уже есть', true);
      if (isNew) S.data.promos.push(Object.assign({ used: 0 }, promo));
      else Object.assign(S.data.promos.find(x => x.code === p.code), promo);

  const EXP_CATS = ['Реклама', 'Флаконы и атомайзеры', 'Закуп ароматов', 'Коробки и упаковка', 'Доставка', 'Прочее'];
  function monthData(m) {
    const d = S.data, inM = x => (x || '').slice(0, 7) === m;
    const sales = d.sales.filter(s => inM(s.date));
    const revenue = sales.reduce((a, s) => a + s.revenue, 0), profit = sales.reduce((a, s) => a + s.profit, 0), ml = sales.reduce((a, s) => a + s.ml, 0);
    const nOrders = new Set(sales.map(s => s.order + '|' + s.date.slice(0, 10))).size;
    const expenses = (d.expenses || []).filter(e => inM(e.date)).sort((a, b) => b.date.localeCompare(a.date));
    const spent = expenses.reduce((a, e) => a + e.amount, 0);
    const byCat = {};
    expenses.forEach(e => { byCat[e.category] = (byCat[e.category] || 0) + e.amount; });
    const top = {};
    sales.forEach(s => { const t = top[s.product_id || s.product] = top[s.product_id || s.product] || { name: s.product, ml: 0, r: 0, p: 0 }; t.ml += s.ml; t.r += s.revenue; t.p += s.profit; });
    const orders = d.orders.filter(o => inM(o.date) && o.status === 'Продано').sort((a, b) => a.date.localeCompare(b.date));
    const newClients = d.clients.filter(c => inM(c.created)).length;
    const receipts = (d.receipts || []).filter(r => inM(r.date)).sort((a, b) => b.number.localeCompare(a.number));
    return { revenue, profit, ml, nOrders, expenses, spent, byCat, top: Object.values(top).sort((a, b) => b.r - a.r), orders, newClients, receipts };
  }
